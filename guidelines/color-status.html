<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--paper)}</style></head><body><div style="display:flex;gap:10px;align-items:center">
<span style="background:var(--success-100);color:var(--success-600);font:var(--label-sm);letter-spacing:var(--track-label);padding:7px 11px">En stock</span>
<span style="background:var(--warning-100);color:var(--warning-600);font:var(--label-sm);letter-spacing:var(--track-label);padding:7px 11px">Últimas 3 unidades</span>
<span style="background:var(--info-100);color:var(--info-600);font:var(--label-sm);letter-spacing:var(--track-label);padding:7px 11px">Envío estimado 2–4 días</span>
<span style="background:var(--ink-050);color:var(--ink-500);font:var(--label-sm);letter-spacing:var(--track-label);padding:7px 11px">Agotado</span></div></body></html>
