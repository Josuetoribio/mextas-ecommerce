<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Flat at rest; shadow only on hover, popovers and drawers" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--paper)}</style></head><body><div style="display:flex;gap:20px;align-items:center;padding:14px">
<div style="width:150px;height:96px;background:var(--paper);border:1px solid var(--border-subtle);display:grid;place-items:center;font:var(--body-xs);color:var(--text-muted)">rest — none</div>
<div style="width:150px;height:96px;background:var(--paper);box-shadow:var(--shadow-card);display:grid;place-items:center;font:var(--body-xs);color:var(--text-muted)">card hover</div>
<div style="width:150px;height:96px;background:var(--paper);box-shadow:var(--shadow-pop);display:grid;place-items:center;font:var(--body-xs);color:var(--text-muted)">modal / toast</div>
<div style="width:150px;height:96px;background:var(--paper);box-shadow:var(--shadow-drawer);display:grid;place-items:center;font:var(--body-xs);color:var(--text-muted)">drawer</div></div></body></html>
